<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face & ID Card Detection Pro</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <span class="icon">🪪</span>
                <h1>VisionDetect <span>AI</span></h1>
            </div>
            <p class="subtitle">Simultaneous Real-time Face & ID Card Detection (YOLOv8)</p>
        </header>

        <main class="workspace">
            <div class="controls-panel glass-panel">
                <h2>Input Source</h2>
                
                <div class="button-group">
                    <button id="btn-webcam" class="btn primary-btn">
                        <span class="btn-icon">📷</span> Live Camera
                    </button>
                    <label for="file-upload" class="btn secondary-btn">
                        <span class="btn-icon">📁</span> Upload Video
                    </label>
                    <input id="file-upload" type="file" accept="video/mp4,video/x-m4v,video/*" style="display: none;">
                </div>
                
                <div class="status-indicator">
                    <div class="dot" id="connection-dot"></div>
                    <span id="connection-status">Disconnected</span>
                </div>
                
                <div class="stats-panel">
                    <div class="stat-box">
                        <span class="stat-value" id="fps-counter">0</span>
                        <span class="stat-label">FPS</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-value" id="faces-counter">0</span>
                        <span class="stat-label">Faces</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-value" id="id-cards-counter">0</span>
                        <span class="stat-label">ID Cards</span>
                    </div>
                </div>
            </div>

            <div class="display-panel glass-panel">
                <div class="video-container" id="video-container">
                    <div class="placeholder" id="video-placeholder">
                        <span class="placeholder-icon">🎬</span>
                        <p>Select a video source to begin detection</p>
                    </div>
                    <!-- The video element for local playback -->
                    <video id="video-element" autoplay playsinline muted></video>
                    <!-- The canvas overlay for drawing bounding boxes -->
                    <canvas id="canvas-overlay"></canvas>
                </div>
            </div>
        </main>
    </div>
    
    <script type="module" src="./main.js"></script>
</body>
</html>
